<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffdfa">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>THE.TRAIL Clients</title>
  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <script src="./native.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="app-header"><details class="role-switch" id="role-switch"><summary class="app-brand" aria-label="Переключить роль"><span class="brand-mark"><img src="./icon.png" width="34" height="34" alt=""></span><span class="brand-caption"><span class="brand">THE.TRAIL</span><span class="brand-sub" id="current-role">Суперадмин</span></span></summary><div class="role-menu" id="role-menu"></div></details><div class="header-controls"><button id="sync-now" class="sync-indicator" type="button" aria-label="Загрузка синхронизации" disabled><span id="sync-icon" aria-hidden="true"></span><span id="save-status" class="sr-only" role="status">Загрузка…</span></button><a class="gear-link" href="#settings" aria-label="Настройки" title="Настройки"></a></div></header>
  <main id="app" aria-live="polite"><div class="empty"><h1>Открываю базу…</h1></div></main>
  <nav class="app-nav" aria-label="Основные разделы"><a href="#todo">ToDo</a><a href="#clients">Клиенты</a><a href="#calendar" hidden>Календарь</a><a href="#coach" hidden>Тренер</a><a href="#account">Учёт</a><a href="#races">Старты</a><a href="#admin">Админ</a><a href="#profile" hidden>Профиль</a></nav>
  <div id="notice" class="notice" role="status" hidden></div>
  <dialog id="editor" aria-labelledby="editor-title"></dialog>
</body>
</html>
