name: Android app and update
on:
  push:
    branches: [main]
    paths: ['src/**', 'mobile/**', 'scripts/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'index.html', 'icon.svg', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trail-clients-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: mobile
      - name: Test application and backend
        run: |
          pnpm test
          python3 -m unittest discover -s server/tests -v
      - name: Build offline app and update
        run: pnpm build && pnpm check && pnpm package:update
      - name: Synchronize Android project
        run: pnpm exec cap sync android
        working-directory: mobile
      - name: Compile release APK
        run: bash gradlew --no-daemon assembleRelease
        working-directory: mobile/android
      - name: Prepare artifact for private local signing
        run: |
          mkdir -p native-artifact
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk native-artifact/THE-TRAIL-Clients-Android-unsigned.apk
          cp "$tools/lib/apksigner.jar" native-artifact/apksigner.jar
          cp "$tools/NOTICE.txt" native-artifact/ANDROID-TOOLS-NOTICE.txt
          sha256sum native-artifact/* > native-artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-for-local-signing
          path: native-artifact/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: interface-update
          path: mobile/update/
          retention-days: 14
      - name: Publish versioned interface update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; immutable update assets are retained."
          else
            gh release create "$tag" mobile/update/THE-TRAIL-Clients-update.zip mobile/update/version.json mobile/update/SHA256SUMS --target "$GITHUB_SHA" --title "THE.TRAIL Clients $version" --notes-file docs/release-notes.md
          fi
